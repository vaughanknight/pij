# The addressable fixture corpus (workshop 001 R6b).
#
# Real captured pij traffic, malformed cases INCLUDED, with a known answer for
# each — so a packet can cite a fixture by path and a reviewer can check the
# claim without re-capturing anything. Captured 2026-08-28 from the live TS pij
# on this machine (pij --version at capture time is recorded in the plan's
# reports/, not here, so this file stays a pure index).
#
# Rule: a fixture is only useful with its EXPECTATION. `answer` is what a
# correct implementation must do with the bytes — not a description of them.

version = 1

[[fixture]]
path = "cli/models.json"
sha256 = "a01aa1cec6a96cd4d3553ab0ca6624ea319925f4d65ff95a31ce72859cd3e468"
bytes = 3182
note = "pij models --json, 2026-08-28, one row per provider plus rows covering every observed `levels` encoding. The live catalog is TIME-VARYING (599 rows at 05:05, 125 at 05:15 as the openrouter list shrank 479->5), so a byte-golden against the live binary would flap; the golden runs against these committed bytes."
answer = "10 rows, 8 providers. TWO encodings of 'no thinking levels' appear in real output — `\"levels\": []` and the key ABSENT (claude rows) — and NEITHER is the `null` that services.dd.json assumes. u-models must map both to the same fact and must not invent a third."

