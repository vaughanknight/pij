# The addressable fixture corpus (workshop 001 R6b).
#
# Real captured pij traffic, malformed cases INCLUDED, with a known answer for
# each — so a packet can cite a fixture by path and a reviewer can check the
# claim without re-capturing anything.
#
# Rule: a fixture is only useful with its EXPECTATION. `answer` is what a correct
# implementation must DO with the bytes — not a description of them.
#
# TWO FAMILIES, and the split is load-bearing:
#
#   malformed/rs/  the Rust v1 wire shape {v, at, kind, seat, payload}. The
#                  decoder in pij-core/src/wire.rs is judged against these.
#   malformed/ts/  the LIVE TypeScript daemon's shape {seq, timestamp, type,
#                  data}. Captured, not invented — and NOT what v1 speaks. These
#                  belong to the migration/parity reader of wave 3+.
#
# The split exists because the first draft of the wire tests read TS captures
# with the v1 decoder and failed: the two schemas genuinely differ, and pretending
# otherwise would have meant bending one of them to hide it.

version = 1


