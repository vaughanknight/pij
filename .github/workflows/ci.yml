name: ci

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same ref. Merging a queue of N PRs one by one
# starts N full runs on main, and only the last tests the tree anyone ships —
# the other N-1 verify intermediate states that exist for seconds. Measured:
# five sequential merges burned five runs (3 matrix jobs each) where one was
# needed.
#
# Safe here because every PR is already green on its own head before it merges,
# so a main run re-verifies the MERGE RESULT rather than the change. The cost is
# bisect precision: if commit 3 of 5 is what actually broke main, its run is
# cancelled and only commit 5 reports red. That still says "main is broken",
# which is the signal this run exists to produce; the culprit is then one
# `gh run rerun` away.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `just` is required by tests that exercise the repo's own recipes
      # (e.g. the pij-bin-shape check). CI runs npm scripts directly, so install
      # just explicitly rather than assume it on the runner.
      - uses: extractions/setup-just@v2
      - run: npm ci --min-release-age=null
      # Lockfile source-host allowlist (PR#25): the compensating control for
      # npmjs-scoped host replacement. Every `resolved` URL must be npmjs or the
      # sanctioned minih git source — a tampered lockfile fails LOUD, here, before
      # anything is built. Tamper-detection, not silent install-time redirection.
      - run: node_modules/.bin/tsx harness/scripts/lockfile-allowlist.ts
      - run: npm run typecheck
      - run: npm run lint
      # Integration suites that drive a private Rust daemon (cli.inbox.integration,
      # the watchdog smoke) need the debug pij-rs binary; build it here and make
      # its presence REQUIRED so a missing binary fails loud instead of skipping.
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p pij-cli --bin pij-rs
      # npm test now includes the two-peer integration smoke
      # (.pi/extensions/pij/cli.integration.test.ts) — AC-1..11 + AC-13 end-to-end
      # against the real cli.ts over a sandboxed PIJ_HOME, deterministic + in-CI.
      - run: npm test
        env:
          PIJ_RS_BIN_REQUIRED: '1'
      # Native extension contracts use node:test, outside Vitest's TS include.
      - run: just copilot-native-test
      # npm audit runs REPORT-ONLY (`|| true`) — the repo's Plan-009 security
      # posture is report-and-continue. The remaining 26 findings are transitive
      # through pinned minih 0.2.4, with no green released upstream fix. Surface
      # them without failing CI; hard gate on demand: `npm audit`.
      - run: npm audit --audit-level=high || true
      # The live two-window Driver smoke (.pi/extensions/pij/smoke.ts, /pij status
      # line) stays local-only — needs tmux + the pi binary, absent on hosted
      # runners. Run via `just smoke` / `just self-check`. AC-12: gates +
      # integration smoke green in CI; live Driver smoke green locally.

  windows-compat:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --min-release-age=null
      - run: npm run windows:check

  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Installs exactly what rust-toolchain.toml pins, including rustfmt and
      # clippy, so local and CI toolchains cannot drift.
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2

      - name: toolchain matches the pin
        run: |
          rustc --version
          test "$(rustc --version | cut -d' ' -f2)" = "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"

      # Run the cheap lockfile check before compilation. Plain cargo commands may
      # update a stale Cargo.lock and hide a later --locked release failure.
      - name: lockfile is current
        run: cargo metadata --locked --format-version 1

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  rust-test:
    runs-on: ubuntu-latest
    # Backstop only. Hung tests are killed and named by nextest's per-test
    # clock (.config/nextest.toml, profile `ci`) in about a minute each.
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: build tests
        run: cargo nextest run --locked --workspace --profile ci --no-run

      # DIAGNOSTIC: tests run as a separate user, so a test that signals the
      # runner's processes gets EPERM instead of killing the job. Every kill(2)
      # is traced; any aimed at a runner process, pid 0 or a process group is
      # printed at the end. A root-owned loop also mirrors progress into a PR
      # comment every 5s in case the VM still dies.
      - name: test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          cid=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -f body="rust-test telemetry: starting" --jq .id)
          cat > telemetry.sh <<'EOF'
          #!/bin/bash
          cid=$1; repo=$2; out=$3
          while sleep 5; do
            {
              echo "### $(date -u +%H:%M:%S) mem=$(awk '/MemAvailable/{printf "%dM", $2/1024}' /proc/meminfo) load=$(cut -d' ' -f1-3 /proc/loadavg) procs=$(ps -e --no-headers | wc -l) runner_worker=$(pgrep -c -f Runner.Worker)"
              echo '```'
              ps -eo etimes=,args= | grep -- '--exact' | grep -v grep | sed -E 's#^ *([0-9]+) \S*/deps/([^ ]+)-[0-9a-f]+ (.*)#\1s \2 \3#' | cut -c1-200
              echo "-- suspicious kills"
              tail -n 10 /tmp/kills.sus 2>/dev/null
              tail -n 4 "$out" | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-200
              echo '```'
            } > /tmp/tele.now
            cat /tmp/tele.now >> /tmp/tele.hist
            tail -c 60000 /tmp/tele.hist > /tmp/tele.body
            gh api -X PATCH "repos/$repo/issues/comments/$cid" -F body=@/tmp/tele.body >/dev/null 2>&1
          done
          EOF
          cat > killwatch.sh <<'EOF'
          #!/bin/bash
          # Resolve every non-probe kill(2) target while it still exists; keep
          # the ones aimed at pid <= 1, a process group, or another user's process.
          while IFS= read -r line; do
            case "$line" in *sys_enter_kill*|*sys_enter_tkill*|*sys_enter_tgkill*) ;; *) continue ;; esac
            echo "$line" >> /tmp/kills.all
            sig=$(sed -nE 's/.*sig: 0x([0-9a-f]+).*/\1/p' <<<"$line")
            [ "$((16#${sig:-0}))" -eq 0 ] && continue
            pidhex=$(sed -nE 's/.*pid: 0x([0-9a-f]+).*/\1/p' <<<"$line")
            pidhex=$(sed -E 's/^0+//' <<<"$pidhex")
            if [ ${#pidhex} -gt 8 ] || [ "$((16#${pidhex:-0}))" -le 1 ]; then
              echo "GROUP-OR-ALL: $line" >> /tmp/kills.sus; continue
            fi
            owner=$(ps -o user=,args= -p "$((16#$pidhex))" 2>/dev/null | cut -c1-140)
            case "$owner" in pijci*) ;; *) echo "$line => ${owner:-gone}" >> /tmp/kills.sus ;; esac
          done < /sys/kernel/tracing/trace_pipe
          EOF
          touch /tmp/kills.sus
          sudo useradd -m pijci
          sudo chmod a+x /home/runner /home/runner/work
          sudo chmod -R a+rwX /home/runner/.cargo /home/runner/.rustup "$GITHUB_WORKSPACE"
          sudo git config --system --add safe.directory '*'
          for event in syscalls/sys_enter_kill syscalls/sys_enter_tgkill syscalls/sys_enter_tkill; do
            echo 1 | sudo tee /sys/kernel/tracing/events/$event/enable >/dev/null
          done
          echo 32768 | sudo tee /sys/kernel/tracing/buffer_size_kb >/dev/null
          sudo nohup bash killwatch.sh >/dev/null 2>&1 &
          sudo -E nohup bash telemetry.sh "$cid" "${{ github.repository }}" "$PWD/nextest.out" >/dev/null 2>&1 &
          sudo systemd-run --scope --quiet \
            -p MemoryMax=11G -p TasksMax=4096 -p CPUQuota=300% \
            --uid=pijci --gid=pijci \
            env "PATH=$PATH" "RUSTFLAGS=$RUSTFLAGS" HOME=/home/pijci CARGO_HOME=/home/runner/.cargo RUSTUP_HOME=/home/runner/.rustup \
            cargo nextest run --locked --workspace --profile ci --status-level pass > nextest.out 2>&1
          status=$?
          cat nextest.out
          sleep 3
          echo "== kill(2) calls traced: $(sudo wc -l < /tmp/kills.all)"
          echo "== suspicious kill(2) calls"
          sudo cat /tmp/kills.sus
          exit "$status"

      # nextest does not run doctests.
      - name: doctests
        run: cargo test --locked --workspace --doc
