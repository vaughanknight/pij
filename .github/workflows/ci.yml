name: ci

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same ref. Merging a queue of N PRs one by one
# starts N full runs on main, and only the last tests the tree anyone ships —
# the other N-1 verify intermediate states that exist for seconds. Measured:
# five sequential merges burned five runs (3 matrix jobs each) where one was
# needed.
#
# Safe here because every PR is already green on its own head before it merges,
# so a main run re-verifies the MERGE RESULT rather than the change. The cost is
# bisect precision: if commit 3 of 5 is what actually broke main, its run is
# cancelled and only commit 5 reports red. That still says "main is broken",
# which is the signal this run exists to produce; the culprit is then one
# `gh run rerun` away.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `just` is required by tests that exercise the repo's own recipes
      # (e.g. the pij-bin-shape check). CI runs npm scripts directly, so install
      # just explicitly rather than assume it on the runner.
      - uses: extractions/setup-just@v2
      - run: npm ci --min-release-age=null
      # Lockfile source-host allowlist (PR#25): the compensating control for
      # npmjs-scoped host replacement. Every `resolved` URL must be npmjs or the
      # sanctioned minih git source — a tampered lockfile fails LOUD, here, before
      # anything is built. Tamper-detection, not silent install-time redirection.
      - run: node_modules/.bin/tsx harness/scripts/lockfile-allowlist.ts
      - run: npm run typecheck
      - run: npm run lint
      # Integration suites that drive a private Rust daemon (cli.inbox.integration,
      # the watchdog smoke) need the debug pij-rs binary; build it here and make
      # its presence REQUIRED so a missing binary fails loud instead of skipping.
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p pij-cli --bin pij-rs
      # npm test now includes the two-peer integration smoke
      # (.pi/extensions/pij/cli.integration.test.ts) — AC-1..11 + AC-13 end-to-end
      # against the real cli.ts over a sandboxed PIJ_HOME, deterministic + in-CI.
      - run: npm test
        env:
          PIJ_RS_BIN_REQUIRED: '1'
      # Native extension contracts use node:test, outside Vitest's TS include.
      - run: just copilot-native-test
      # npm audit runs REPORT-ONLY (`|| true`) — the repo's Plan-009 security
      # posture is report-and-continue. The remaining 26 findings are transitive
      # through pinned minih 0.2.4, with no green released upstream fix. Surface
      # them without failing CI; hard gate on demand: `npm audit`.
      - run: npm audit --audit-level=high || true
      # The live two-window Driver smoke (.pi/extensions/pij/smoke.ts, /pij status
      # line) stays local-only — needs tmux + the pi binary, absent on hosted
      # runners. Run via `just smoke` / `just self-check`. AC-12: gates +
      # integration smoke green in CI; live Driver smoke green locally.

  windows-compat:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --min-release-age=null
      - run: npm run windows:check

  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Installs exactly what rust-toolchain.toml pins, including rustfmt and
      # clippy, so local and CI toolchains cannot drift.
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2

      - name: toolchain matches the pin
        run: |
          rustc --version
          test "$(rustc --version | cut -d' ' -f2)" = "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"

      # Run the cheap lockfile check before compilation. Plain cargo commands may
      # update a stale Cargo.lock and hide a later --locked release failure.
      - name: lockfile is current
        run: cargo metadata --locked --format-version 1

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  rust-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        filter:
          - "not binary_id(pij-cli::governance_boot)"
          - "not binary_id(pij-cli::daemon_log)"
          - "not binary_id(pij-cli::lifecycle)"
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: build tests
        run: cargo nextest run --locked --workspace --profile ci --no-run

      # DIAGNOSTIC bisect.
      - name: test
        run: cargo nextest run --locked --workspace --profile ci --status-level pass -E '${{ matrix.filter }}'
