# pij third-party pi-extension manifest — source of truth.
# Edit here, then `npm run pkg sync` (or use `pkg add/enable/disable`).
# .pi/settings.json#packages is generated from this; do not hand-edit it.
#
# Each entry:
#   source:   npm:<name>[@version] | https://github.com/.../repo.git | ./local/path
#   enabled:  true → installed by pi on boot; false → removed via `pi remove` on sync
#   note:     optional reminder of why this is here
#   requires: optional { bin, install } — bootstrap checks `<bin> --version`;
#             if missing, runs the shell command in `install` first
#   vetted:   recorded by `npm run pkg vet` / `pkg audit` (Plan 009).
#             Shape: { date: ISO8601, score: 0-100, overrides?: Overrides, agentRubric?: sha256-hex }
#             `pkg bootstrap` refuses entries with missing or stale (>30d) vetted.date
#             unless --unsafe (which requires a non-empty reason in `overrides.reason`).
#
#   overrides (FX001-1): typed { rules: string[]; reason: string }. `rules`
#             enumerates which Finding.rule slugs the override accepts as
#             warn→ok. A new unrelated warn still fails audit. `fail` is
#             never auto-downgraded by override. Worked example:
#
#               vetted:
#                 date: 2026-05-15T16:25:00Z
#                 score: 98
#                 overrides:
#                   rules:
#                     - github-trust:no-license     # specific rule(s) accepted
#                   reason: install-only use; flagged in research-dossier.md
#
#             Legacy free-text `overrides: "<reason>"` parses fail-safe
#             (rules:[]) and prints a one-line deprecation warning.

packages:
  - source: https://github.com/nicobailon/pi-mcp-adapter.git
    enabled: true
    note: MCP bridge
    vetted:
      date: 2026-05-27T06:25:13.290Z
      score: 100
      agentRubric: cdf5f5b250017754e9fcc746ec303d5f99fe8868eedbfd2b218dff32bb79e720
  - source: git:https://github.com/hasit/pi-community-themes@v0.3.0
    enabled: true
    note: Community pi themes
    vetted:
      date: 2026-06-16T07:49:11.027Z
      score: 100
      agentRubric: cdf5f5b250017754e9fcc746ec303d5f99fe8868eedbfd2b218dff32bb79e720
  - source: npm:pi-lean-ctx
    enabled: true
    note: 60-90% token compression on bash/read/grep/find/ls
    requires:
      bin: lean-ctx
      # pi-lean-ctx's resolveBinary() searches ~/.cargo/bin, ~/.local/bin,
      # /usr/local/bin, then PATH. Brew on Apple Silicon installs to
      # /opt/homebrew/bin which isn't searched — symlink into ~/.local/bin.
      install: brew tap yvgude/lean-ctx && brew install lean-ctx && mkdir -p ~/.local/bin && ln -sf "$(brew --prefix)/bin/lean-ctx" ~/.local/bin/lean-ctx
    vetted:
      date: 2026-06-16T07:49:11.942Z
      score: 100
  - source: git:github.com/ghoseb/pi-askuserquestion
    enabled: true
    note: batched AskUserQuestion modal
    vetted:
      date: 2026-05-15T16:25:00Z
      score: 98
      # warn-level finding: no LICENSE file. We noted this in plan 009 research
      # (the author shipped the repo without a LICENSE). Consuming the published
      # repo via `pi install` is fine; redistribution would not be. Accepted
      # with explicit reason per T005 contingency rules.
      # FX001-1: typed override — only the named rule is auto-downgraded; any
      # new unrelated warn (e.g. a fresh npm-audit:high CVE) still fails audit.
      # 2026-06-15: upstream devDependencies (vite/vitest/esbuild/ws/protobufjs)
      # now carry high/critical npm-audit advisories. These are FAIL-severity and
      # are NOT downgradeable by overrides (by design). They live only in
      # devDependencies; pi installs with --omit=dev so they never ship at
      # runtime. User-accepted as a dev-tooling-only risk. Consequence: this
      # entry's raw verdict stays `fail`, so `pkg audit` will not refresh its
      # date and `pkg bootstrap` requires --unsafe until upstream bumps its dev
      # deps. Only the no-license warn below is actually masked.
      overrides:
        rules:
          - github-trust:no-license
        reason: no-LICENSE on upstream; install-only use, not redistribution; flagged in research-dossier.md
  - source: npm:pi-subagents
    enabled: true
    note: subagent delegation extension per plan 007
    vetted:
      date: 2026-06-16T07:49:17.308Z
      score: 100
      agentRubric: cdf5f5b250017754e9fcc746ec303d5f99fe8868eedbfd2b218dff32bb79e720
  - source: npm:pi-smart-fetch
    enabled: true
    note: smart web_fetch with desktop-browser TLS impersonation; markdown/html/text/json/raw output
    vetted:
      date: 2026-06-16T07:49:18.230Z
      score: 100
      agentRubric: cdf5f5b250017754e9fcc746ec303d5f99fe8868eedbfd2b218dff32bb79e720
